<script>
    $(document).ready(function () {
		const multiFieldMatcher = function (fields) {
			return function(params, data) {
				if ($.trim(params.term) === '') return data;
				
				var term = params.term.toLowerCase();
				
				// Check specified fields
				for (var i = 0; i < fields.length; i++) {
					var value = data[fields[i]];
					if (value && String(value).toLowerCase().indexOf(term) > -1) {
						return data;
					}
				}
				
				// Check data attributes on the DOM element
				if (data.element) {
					var attrs = $(data.element).data();
					for (var key in attrs) {
						// Skip Select2 internals
						if (key === 'select2Id' || key === 'select2Tag' || key.indexOf('select2') === 0) {
							continue;
						}
						if (String(attrs[key]).toLowerCase().indexOf(term) > -1) {
							return data;
						}
					}
				}
				
				return null;
			};
		}
		
		const uniNameMatcher = multiFieldMatcher(['text']);
		
		const resetUniPicker = function () {
			if ($('#UniversityName').hasClass('select2-hidden-accessible') || $('#UniversityName').data('select2')) {
				$('#UniversityName').select2('destroy');
			}
			$('#UniversityName').select2({
				placeholder: '------請選擇院校------',
				matcher: uniNameMatcher,
				allowClear: true
			});
		};
		
		resetUniPicker();
		
        $('#submitform').on('click', function () {
            $("#loadingDiv").show();
            $.ajax({
                url: 'ShowSearchMajor.jsp',
                type: "POST",
                data: {
                    type: $("input[name='SearchField']:checked").val(),
                    UniversityName: $('#UniversityName').val(),
                    InputMajor: $('#InputMajor').val(),
                    EnrollmentSection: $('#EnrollmentSection').val(),
                    IsEngTeach: $('#SearchEngTeach').is(':checked') ? '1' : ''
                },
                dataType: "text",
                success: function (result) {
                    /*
                    $('#formDetail').html(result);
                    $('#formDetail').show();
                    */
                    
                    // Because this handler fires repeatedly, we cannot call attachShadow()
                    // on the same element twice. Solution: keep #formDetail as a stable
                    // wrapper and recreate its inner #formDetailShadow child on every
                    // successful response, so a fresh shadow root can be attached each time.

                    var hostWrapper = $('#formDetail');

                    // 1. Remove any previous shadow host from the last call, then create
                    //    and insert a brand-new empty <div id="formDetailShadow">.
                    //    Recreating the element is what allows attachShadow() to be
                    //    called again (an element can only host one shadow root ever).
                    hostWrapper.find('#formDetailShadow').remove();
                    var host = document.createElement('div');
                    host.id = 'formDetailShadow';
                    hostWrapper.append(host);

                    // 2. Attach an open shadow root. 'open' means we can still reach it
                    //    later via document.getElementById('formDetailShadow').shadowRoot.
                    var shadow = host.attachShadow({ mode: 'open' });

                    // 3. Parse the returned HTML string into a detached Document so we
                    //    can cleanly separate <head> resources from <body> content.
                    var doc = new DOMParser().parseFromString(result, 'text/html');

                    // 4. Clone <style> and <link rel="stylesheet"> nodes from the parsed
                    //    document's <head> into the shadow root. These now style only the
                    //    shadow tree — nothing leaks into the host document.
                    doc.querySelectorAll('head style, head link[rel="stylesheet"]').forEach(function (node) {
                        shadow.appendChild(node.cloneNode(true));
                    });

                    // 5. Move the <body> markup into a wrapper div and append it to the
                    //    shadow root. body.innerHTML preserves all nested markup.
                    var wrapper = document.createElement('div');
                    wrapper.innerHTML = doc.body.innerHTML;
                    shadow.appendChild(wrapper);

                    // 6. Show the wrapper and hide the loading indicator (unchanged).
                    //    Operate on #formDetail (the host page element), not the shadow
                    //    contents — jQuery cannot select inside a shadow root.
                    hostWrapper.show();
                    
                    $('#loadingDiv').hide();
                }
            });
        });

        $('#UniversityName').on('change', function () {
            $("#SearchByUniversity").prop('checked', 'checked');
        });

        $('#InputMajor').on('change textInput input', function () {
            $("#SearchByMajor").prop('checked', 'checked');
        });

         $('#EnrollmentSection').on('change', function () {
            $('#UniversityName').empty();

            $.ajax({
                type: 'get',
                contentType: "application/json;charset=utf-8",
                url: 'GetSectionUniversityList.jsp',
                dataType: 'json',
                data: {
                    EnrollmentSection: $('#EnrollmentSection').val()
                },
                success: function (data) {
                	$('#UniversityName').empty();
                    $('#UniversityName').append('<option value=""></option>');
                    for(i = 0; i < data.length; i++){
                    	 $('#UniversityName').append("<option value='" + data[i].UName + "'>" +  data[i].NAME_C  + "</option>");
                	}
                },
                error: function (ex) {
                    alert('Failed to retrieve states.' + ex);
                },
                complete: function (xhr, textStatus) {
                	resetUniPicker();
                }
            });
            return false;
        }); 
    });
</script>

           <script type="text/javascript">
           function replaceUrlParam(url, paramName, paramValue){
        	    var pattern = new RegExp('(\\?|\\&)('+paramName+'=).*?(&|$)');
        	    var newUrl=url;
        	    if(url.search(pattern)>=0){
        	        newUrl = url.replace(pattern,'$1$2' + paramValue + '$3');
        	    }
        	    else{
        	        newUrl = newUrl + (newUrl.indexOf('?')>0 ? '&' : '?') + paramName + '=' + paramValue;
        	    }
        	    return newUrl;
        	}
           </script>
